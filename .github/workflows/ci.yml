name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Unit Test
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app
        run: |
          xcodebuild \
            -project SimpleImageViewer.xcodeproj \
            -scheme SimpleImageViewer \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project SimpleImageViewer.xcodeproj \
            -scheme SimpleImageViewer \
            -destination 'platform=macOS' \
            -only-testing:SimpleImageViewerTests \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO
